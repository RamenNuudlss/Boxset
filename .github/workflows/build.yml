name: Build Windows installer

on:
  push:
    branches: [main]      # test build: installer is attached to the run
    tags: ["v*"]          # release: installer is also attached to the GitHub release
  workflow_dispatch:

permissions:
  contents: write     # lets the release step attach the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version from tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || v="0.0.0-dev"
          echo "APP_VERSION=$v" >> $GITHUB_ENV

      - name: Build the app
        run: pyinstaller --noconfirm packaging/boxset.spec

      - name: Bundle FFmpeg (GPL build with x264)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/Boxset/bin | Out-Null
          Copy-Item $bin.FullName dist/Boxset/bin/
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") dist/Boxset/bin/
          $lic = Get-ChildItem ffmpeg -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName dist/Boxset/bin/FFMPEG-LICENSE.txt }
          Copy-Item THIRD_PARTY_NOTICES.md dist/Boxset/

      - name: Fetch the WebView2 installer (used only on PCs that lack it)
        shell: pwsh
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging/MicrosoftEdgeWebview2Setup.exe

      - name: Smoke test
        run: |
          dist\Boxset\boxset-cli.exe themes packaging\smoke.boxset

      - name: Check the graphics card settings against the bundled FFmpeg
        # The runner has no graphics card, so each encoder must get past option
        # checking and stop only at "no device"; a rejected option fails the build.
        shell: bash
        run: |
          python - <<'EOF'
          import subprocess, sys
          sys.path.insert(0, ".")
          from boxset import encoders
          ffmpeg = r"dist/Boxset/bin/ffmpeg.exe"
          bad = ("Unrecognized option", "Option not found", "Error setting option",
                 "Invalid argument for option", "Unable to parse option", "Undefined constant")
          ok = True
          for enc, _ in encoders.GPU_ENCODERS:
              cmd = [ffmpeg, "-hide_banner", "-v", "error", "-f", "lavfi",
                     "-i", "color=black:s=1920x1080:r=24000/1001", "-frames:v", "5"]
              cmd += encoders.gpu_args(enc, (24000, 1001), 30e6, 8e6, [1.0]) + ["-f", "null", "-"]
              err = subprocess.run(cmd, capture_output=True, text=True).stderr
              hit = [ln for ln in err.splitlines() if any(b in ln for b in bad)]
              print(enc, "REJECTED: " + " | ".join(hit) if hit else "options accepted",
                    "|", (err.strip().splitlines() or ["(encoded)"])[0][:160])
              ok &= not hit
          sys.exit(0 if ok else 1)
          EOF

      - name: Check that burner detection runs on Windows
        # The runner has no disc drive: the script must still run cleanly and return a list.
        shell: bash
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          sys.path.insert(0, ".")
          from boxset import burner
          r = subprocess.run([burner._powershell(), "-NoProfile", "-NonInteractive", "-ExecutionPolicy",
                              "Bypass", "-Command", burner._SCRIPT], capture_output=True, text=True, timeout=120)
          print("stdout:", r.stdout.strip()[:500]); print("stderr:", r.stderr.strip()[:500])
          data = json.loads(r.stdout.strip())
          assert isinstance(data, list), data
          print("drives:", burner.list_drives())
          EOF

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: BoxsetSetup
          path: dist/BoxsetSetup-*.exe

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BoxsetSetup-*.exe
